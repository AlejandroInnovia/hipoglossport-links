<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
 ============== VISTA PREVIA AL COMPARTIR · SE LLENA A MANO ==============
 WhatsApp, Instagram, Facebook y Google NO ejecutan JavaScript: leen solo
 estas etiquetas fijas. Si se dejan vacías, el enlace aparece como
 "Marca · Links", sin descripción ni imagen.
 - <title> y description: el mismo texto que BRAND.pageTitle y BRAND.description.
 - og:title: nombre de la marca con su símbolo. Ej: "Normalibs®"
 - og:description: una línea corta de la bio. Ej: "Probiótico ... · Centroamérica"
 - og:url: https://[marca]-links.vercel.app/
 - og:image: URL COMPLETA (https://...) de una imagen PNG o JPG de 1200×630
   con el logo. No use WEBP: WhatsApp no siempre la muestra.
 - icon: el mismo archivo que BRAND.favicon.
 ======================================================================= -->
<title>Hipoglós Sport Links</title>
<meta name="description" content="Hipoglós® Sport · Contra las rozaduras por deporte, con más de 80 años de trayectoria.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hipoglossport-links.vercel.app/">
<meta property="og:title" content="Hipoglós® Sport">
<meta property="og:description" content="Contra las rozaduras por deporte · Más de 80 años de trayectoria · Centroamérica">
<meta property="og:image" content="https://hipoglossport-links.vercel.app/assets/og-hipoglossport.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-css" rel="stylesheet" href="">
<link rel="icon" href="assets/favicon.png">
<!--
==========================================================================
 PLANTILLA LINKTREE · INNOVIA
 Solo se editan el bloque BRAND (más abajo, dentro de <script>) y el
 bloque VISTA PREVIA AL COMPARTIR (arriba, en el <head>).
 Todo lo demás (diseño, animaciones, modo claro/oscuro, accesibilidad)
 ya está resuelto y no se toca.
==========================================================================
-->
<style>
:root{
  /* Estos valores se reemplazan desde BRAND.colors al cargar la página */
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#1D1D1B; --head:#0A3A47; --muted:#5B6E73; --line:#E6E3DD;
  --accent:#0B7880; --accent-ink:#0A7A83; --aqua:#7EC3CF; --soft:#E4F1F2; --glass:rgba(255,255,255,.72);
  --font-head:"Montserrat",Arial,sans-serif; --font-body:"Montserrat",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
:root[data-mode="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s;overflow-x:hidden}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px;border-radius:14px}
sup{font-size:.6em;line-height:0}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;width:420px;height:420px;border-radius:50%;background-size:cover;background-position:center;filter:blur(70px);opacity:.28}
.amb i:nth-child(1){top:-160px;left:-160px}
.amb i:nth-child(2){bottom:-180px;right:-170px;opacity:.22}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:28px 32px;min-height:100vh;display:flex;flex-direction:column}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:18px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:20px;animation:up .7s var(--ease) both}
.bar{align-self:stretch;display:flex;justify-content:flex-end;gap:8px}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--head);cursor:pointer;transition:transform .2s var(--ease)}
.iconbtn:hover{transform:translateY(-2px)}
.theme .sun{display:none}
:root[data-mode="dark"] .theme .sun{display:block}:root[data-mode="dark"] .theme .moon{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--head);color:var(--bg);font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:99px;transition:all .3s var(--ease);z-index:5;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.avatar{position:relative;width:132px;height:132px;margin-top:2px;animation:pop .9s var(--spring) both .1s}
.avatar .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.25))}
.avatar.spin .pic{animation:spin 80s linear infinite}
.avatar::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--aqua);animation:ripple 4s ease-out 3 1s}
.avatar .scrim{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,.18) 60%,rgba(0,0,0,0))}
.avatar .lg{position:absolute;left:12%;top:50%;transform:translateY(-50%);width:76%;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
h1{margin:0;font-family:var(--font-head);font-size:24px;font-weight:800;color:var(--head);letter-spacing:-.01em;display:flex;align-items:center;gap:6px;text-align:center}
h1 svg{flex:none;color:#3897F0}
.bio{margin:-10px 0 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.55;max-width:34ch;text-wrap:balance}
.bio b{color:var(--head);font-weight:600}
.socials{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.socials a,.socials .off{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:var(--head);transition:transform .25s var(--ease),background .2s}
.socials a:hover{transform:translateY(-3px);background:var(--soft)}
.socials .off{opacity:.4;cursor:default}
.links{align-self:stretch;display:flex;flex-direction:column;gap:12px;list-style:none;margin:4px 0 0;padding:0}
.links li{animation:pop .55s var(--ease) both;animation-delay:calc(var(--i)*80ms + .35s)}
.lk{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:68px;padding:8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--head);text-decoration:none;font-family:var(--font-head);font-weight:700;font-size:15.5px;text-align:center;transition:transform .2s var(--ease),border-color .2s,color .25s,box-shadow .25s}
.lk::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .38s var(--ease);z-index:-1}
a.lk:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 16px 28px -20px rgba(0,0,0,.5)}
a.lk:hover::before,a.lk:focus-visible::before{transform:scaleX(1)}
a.lk:hover,a.lk:focus-visible{color:var(--on-accent,#fff)}
.lk .th{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent-ink);transition:background .25s,color .25s}
a.lk:hover .th,a.lk:focus-visible .th{background:rgba(255,255,255,.18);color:var(--on-accent,#fff)}
.lk .go{justify-self:center;opacity:.55;transition:transform .25s var(--ease),opacity .2s}
a.lk:hover .go{transform:translateX(3px);opacity:1}
.lk.soon{cursor:default;border-style:dashed;background:transparent;grid-template-columns:52px 1fr auto;padding-right:14px}
.lk.soon::before{display:none}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--soft);border-radius:99px;padding:6px 10px;white-space:nowrap}
.foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:up .7s var(--ease) both .8s}
.logos{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.logos img{width:110px;height:auto;max-width:40%}
:root:not([data-mode="dark"]) .logos img.white{filter:brightness(0) saturate(100%);opacity:.65}
:root[data-mode="dark"] .logos img.white{opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes up{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{from{transform:scale(.92);opacity:.8}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="amb" aria-hidden="true"><i></i><i></i></div>
<div class="wrap">
  <main class="card">
    <div class="bar">
      <button class="iconbtn" id="share" type="button" aria-label="Compartir esta página" title="Compartir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg></button>
      <button class="iconbtn theme" id="theme" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <nav class="socials" id="socials" aria-label="Redes sociales"></nav>
    <ul class="links" id="links"></ul>
  </main>
  <footer class="foot"><div class="logos" id="logos"></div></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =======================================================================
   BRAND · ÚNICO BLOQUE QUE SE EDITA
   Deje "" o [] en lo que no aplique.
   ======================================================================= */
const BRAND={
  name:"<span>Hipoglós<sup>®</sup> Sport</span>", verified:false,
  bio:["Contra las rozaduras por deporte","<b>Más de 80 años</b> de trayectoria","📍 Centroamérica"],
  pageTitle:"Hipoglós Sport Links",
  description:"Hipoglós® Sport · Contra las rozaduras por deporte, con más de 80 años de trayectoria.",
  // Avenir Next viene instalada en iPhone y Mac; en Android y Windows se usa Nunito Sans (Google Fonts), la más parecida
  fonts:{googleFontsUrl:"https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap",heading:'Avenir Next","Nunito Sans',body:'Avenir Next","Nunito Sans'},
  colors:{
    light:{bg:"#FAF6F4",card:"#FFFFFF",ink:"#231916",head:"#231916",muted:"#666565",line:"#EBDFDA",accent:"#CF3405",accentInk:"#B52D04",soft:"#FBE8E1",ring:"#CF3405"},
    dark:{bg:"#1B1B1C",card:"#28282A",ink:"#F2F2F2",head:"#FFFFFF",muted:"#B4B3B3",line:"#3F3F42",accent:"#CF3405",accentInk:"#FF7A52",soft:"#3A2722",ring:"#CF3405"},
    onAccent:"#FFFFFF"},
  defaultMode:"light",
  avatar:{image:"assets/hipoglossport-avatar.webp",logo:"",spin:false,scrim:false},
  ambient:"assets/hipoglossport-ambient.webp", favicon:"assets/favicon.png",
  socials:[
    {icon:"web",url:"",label:"Sitio web",soon:true},
    {icon:"instagram",url:"https://www.instagram.com/hipoglossport/",label:"Instagram"},
    {icon:"facebook",url:"https://www.facebook.com/profile.php?id=61591686373352",label:"Facebook"},
    {icon:"shop",url:"",label:"Tienda en línea",soon:true}],
  links:[
    {icon:"instagram",label:"Instagram",url:"https://www.instagram.com/hipoglossport/"},
    {icon:"facebook",label:"Facebook",url:"https://www.facebook.com/profile.php?id=61591686373352"},
    {icon:"web",label:"Sitio web",soon:true},
    {icon:"shop",label:"Tienda en línea",soon:true}],
  footerLogos:[{src:"assets/innova-blanco.webp",alt:"Innova",white:true},{src:"assets/andromaco-100-blanco.webp",alt:"Andrómaco, 100 aniversario",white:true}],
  utm:"utm_source=linktree&utm_medium=social&utm_campaign=bio"
};
/* =================== FIN DEL BLOQUE EDITABLE =================== */

(function(){
  const $=s=>document.querySelector(s), root=document.documentElement;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const NEW='<span class="sr"> (se abre en una pestaña nueva)</span>';
  const I={
    web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
    instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/>',
    facebook:'',
    tiktok:'<path d="M14 3v11.5a3.5 3.5 0 11-3.5-3.5M14 3c.4 2.6 2 4.2 5 4.5"/>',
    youtube:'<rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5v5l4.3-2.5z" fill="currentColor"/>',
    whatsapp:'<path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-4-1.1z"/><path d="M9 9.5c.3 2 2.5 4.2 4.5 4.5l1-1.2 1.8.8c-.3 1.2-1.2 1.7-2.3 1.6-3-.4-5.6-3-6-6-.1-1.1.4-2 1.6-2.3l.8 1.8z"/>',
    shop:'<path d="M3 4h2l2.2 11h10.6L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>',
    linkedin:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-7M12 13c0-2 1.2-3 2.6-3S17 11 17 13v4"/>'
  };
  /* Íconos iguales a normalibs-links.vercel.app: Facebook relleno, Instagram con punto solo en redes, trazo 2 en botones */
  const FB={social:'<path fill="currentColor" d="M12 2a10 10 0 00-1.6 19.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0012 2z"/>',
            link:'<path fill="currentColor" d="M13.4 21v-7.6h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.7v3h2.6V21z"/>'};
  const svg=(n,s)=>{const social=s>=26;
    if(n==="facebook")return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${social?FB.social:FB.link}</svg>`;
    const extra=n==="instagram"&&social?'<circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>':"";
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${social?1.9:2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.web}${extra}</svg>`};
  const SOCIAL_HOSTS=/instagram|facebook|tiktok|youtube|wa\.me|whatsapp|linkedin/;
  const withUtm=u=>{if(!u||!BRAND.utm||SOCIAL_HOSTS.test(u)||u.startsWith("mailto:"))return u;return u+(u.includes("?")?"&":"?")+BRAND.utm};

  /* fonts + meta */
  if(BRAND.fonts.googleFontsUrl)$("#font-css").href=BRAND.fonts.googleFontsUrl;
  if(BRAND.fonts.heading)root.style.setProperty("--font-head",`"${BRAND.fonts.heading}",Arial,sans-serif`);
  if(BRAND.fonts.body)root.style.setProperty("--font-body",`"${BRAND.fonts.body}",Arial,sans-serif`);
  if(BRAND.pageTitle)document.title=BRAND.pageTitle;
  if(BRAND.description)document.querySelector('meta[name="description"]').content=BRAND.description;
  if(BRAND.favicon)document.querySelector('link[rel="icon"]').href=BRAND.favicon;
  if(BRAND.colors.onAccent)root.style.setProperty("--on-accent",BRAND.colors.onAccent);

  /* colors + mode */
  const map={bg:"--bg",card:"--card",ink:"--ink",head:"--head",muted:"--muted",line:"--line",accent:"--accent",accentInk:"--accent-ink",soft:"--soft",ring:"--aqua"};
  const hexA=(h,a)=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||"");if(!m)return "";const n=parseInt(m[1],16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
  function apply(mode){
    root.dataset.mode=mode;
    const c=BRAND.colors[mode]||{};
    Object.entries(map).forEach(([k,v])=>{if(c[k])root.style.setProperty(v,c[k])});
    if(c.card)root.style.setProperty("--glass",hexA(c.card,.72));
  }
  let saved=null;try{saved=localStorage.getItem("lt-mode")}catch(e){}
  const sys=()=>(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  let mode=saved||(BRAND.defaultMode==="auto"?sys():BRAND.defaultMode);
  apply(mode);
  $("#theme").addEventListener("click",()=>{mode=mode==="dark"?"light":"dark";apply(mode);try{localStorage.setItem("lt-mode",mode)}catch(e){}});

  /* content */
  const a=BRAND.avatar;
  $("#avatar").className="avatar"+(a.spin?" spin":"");
  $("#avatar").innerHTML=(a.image?`<img class="pic" src="${esc(a.image)}" alt="">`:"")+(a.scrim?'<span class="scrim"></span>':"")+(a.logo?`<img class="lg" src="${esc(a.logo)}" alt="${esc(BRAND.name)}">`:"");
  if(BRAND.ambient)document.querySelectorAll(".amb i").forEach(el=>el.style.backgroundImage=`url("${BRAND.ambient}")`);
  $("#name").innerHTML=BRAND.name+(BRAND.verified?' <svg width="20" height="20" viewBox="0 0 24 24" role="img" aria-label="Cuenta verificada"><path fill="currentColor" d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.2z"/><path d="M8 12.2l2.6 2.6L16.2 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':"");
  $("#bio").innerHTML=BRAND.bio.join("<br>");
  $("#socials").innerHTML=BRAND.socials.map(s=>s.soon||!s.url
    ?`<span class="off" role="img" aria-label="${esc(s.label)}, próximamente" title="${esc(s.label)} · Próximamente">${svg(s.icon,26)}</span>`
    :`<a href="${esc(withUtm(s.url))}" target="_blank" rel="noopener" aria-label="${esc(s.label)} (se abre en una pestaña nueva)">${svg(s.icon,26)}</a>`).join("");
  $("#links").innerHTML=BRAND.links.map((l,i)=>l.soon||!l.url
    ?`<li style="--i:${i}"><div class="lk soon" role="link" aria-disabled="true" aria-label="${esc(l.label)}, próximamente"><span class="th">${svg(l.icon,22)}</span><span>${esc(l.label)}</span><span class="badge">Próximamente</span></div></li>`
    :`<li style="--i:${i}"><a class="lk" href="${esc(withUtm(l.url))}" target="_blank" rel="noopener"><span class="th">${svg(l.icon,22)}</span><span>${esc(l.label)}</span><svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>${NEW}</a></li>`).join("");
  $("#logos").innerHTML=BRAND.footerLogos.map(f=>`<img src="${esc(f.src)}" alt="${esc(f.alt)}"${f.white?' class="white"':""}>`).join("");

  /* share */
  const toast=$("#toast");const show=m=>{toast.textContent=m;toast.classList.add("on");clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove("on"),2200)};
  $("#share").addEventListener("click",async()=>{const url=location.href.split("#")[0];
    try{if(navigator.share){await navigator.share({title:BRAND.name.replace(/<[^>]+>/g,""),url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(url);show("Enlace copiado")}catch(e){show(url)}});
})();
</script>
</body>
</html>
